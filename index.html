<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার ফরম - NF WORLD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        body {
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        .header-logo {
            width: 110px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            border: 1px solid #e1e8ed;
        }
        h2.form-title {
            text-align: center;
            color: #0076ce;
            margin-bottom: 16px;
            font-size: 20px;
            border-bottom: 2px solid #0076ce;
            padding-bottom: 6px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 13px;
            color: #4a5568;
        }
        input[type="text"], input[type="tel"], select, textarea {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            background-color: #fff;
        }
        textarea {
            resize: vertical;
            height: 65px;
        }
        input[type="text"]:focus, input[type="tel"]:focus, select:focus, textarea:focus {
            border-color: #0076ce;
            box-shadow: 0 0 0 2px rgba(0, 118, 206, 0.15);
        }
        .submit-btn {
            width: 100%;
            background: #0076ce;
            color: white;
            border: none;
            padding: 11px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 6px;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #005fa3;
        }
        .success-box {
            display: none;
            text-align: center;
            padding: 15px 10px;
        }
        .checkmark {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #27ae60;
            color: white;
            font-size: 32px;
            margin-bottom: 15px;
        }
        .success-message {
            font-size: 16px;
            color: #2c3e50;
            font-weight: bold;
            line-height: 1.5;
        }
        .footer {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #1a365d;
        }
        .footer span {
            color: #0076ce;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-logo">
            <svg viewBox="0 0 300 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
                <path d="M 60 280 L 60 70 C 60 40, 120 40, 140 100 L 140 220 C 140 260, 200 260, 200 180 L 200 140 H 130" fill="none" stroke="url(#blueGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 140 180 H 210" fill="none" stroke="url(#greenGrad)" stroke-width="32" stroke-linecap="round"/>
                <g transform="translate(195, 30) scale(0.65)">
                    <path d="M 30 50 C 10 35, 10 10, 30 -5 C 45 -20, 75 -20, 90 -5 C 110 10, 110 35, 90 50 C 80 60, 75 70, 75 85 H 45 C 45 70, 40 60, 30 50 Z" fill="#2ecc71"/>
                    <rect x="47" y="90" width="26" height="6" rx="3" fill="#0076ce"/>
                    <rect x="50" y="100" width="20" height="5" rx="2" fill="#0076ce"/>
                    <line x1="60" y1="-25" x2="60" y2="-40" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
                    <line x1="20" y1="-15" x2="8" y2="-27" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
                    <line x1="100" y1="-15" x2="112" y2="-27" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
                    <line x1="-5" y1="20" x2="-20" y2="20" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
                    <line x1="125" y1="20" x2="140" y2="20" stroke="#2ecc71" stroke-width="6" stroke-linecap="round"/>
                </g>
                <text x="150" y="330" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="42" fill="#00b4d8" letter-spacing="2">WORLD</text>
                <defs>
                    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#2b4bee"/>
                        <stop offset="100%" stop-color="#00a8ff"/>
                    </linearGradient>
                    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00c853"/>
                        <stop offset="100%" stop-color="#2ecc71"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>
    </div>

    <div class="container">
        <div id="formContainer">
            <h2 class="form-title">অর্ডার ফরম</h2>
            <form id="orderForm" onsubmit="handleFormSubmit(event)">
                <div class="form-group">
                    <label for="name">কাস্টমারের নাম:</label>
                    <input type="text" id="name" placeholder="আপনার পুরো নাম লিখুন" required>
                </div>

                <div class="form-group">
                    <label for="phone">কাস্টমারের নাম্বার (English Digits):</label>
                    <input type="tel" id="phone" pattern="[0-9]{11}" placeholder="017XXXXXXXX" maxlength="11" required>
                </div>

                <div class="form-group">
                    <label for="district">জেলা (বাংলাদেশের ৬৪টি জেলা):</label>
                    <select id="district" onchange="updateThanas()" required>
                        <option value="">জেলা নির্বাচন করুন</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="thana">থানা / উপজেলা:</label>
                    <select id="thana" onchange="updateVillages()" required disabled>
                        <option value="">প্রথমে জেলা নির্বাচন করুন</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="village">এলাকা / গ্রাম:</label>
                    <select id="village" required disabled>
                        <option value="">প্রথমে থানা নির্বাচন করুন</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">বিস্তারিত পূর্ণাঙ্গ ঠিকানা (ইচ্ছামত লিখুন):</label>
                    <textarea id="address" placeholder="বাসা/হোল্ডিং নম্বর, রোড নম্বর, বাজার বা পরিচিত চিহ্ন লিখুন..."></textarea>
                </div>

                <button type="submit" class="submit-btn">অর্ডার নিশ্চিত করুন</button>
            </form>
        </div>

        <div id="successBox" class="success-box">
            <div class="checkmark">✓</div>
            <div class="success-message">
                আপনার ফরমটি সঠিকভাবে সাবমিট হয়েছে।<br><br>
                আপনার WhatsApp-এ নিশ্চিতকরণ মেসেজ পাঠানো হয়েছে। অপেক্ষা করুন, প্রতিনিধি থেকে কল করা হবে।
            </div>
        </div>
    </div>

    <div class="footer">
        helpline: <span>0 9658-699887</span>
    </div>

    <script>
        const districtsList = [
            "বাগেরহাট", "বান্দরবান", "বরগুনা", "বরিশাল", "ভোলা", "বগুড়া", "ব্রাহ্মণবাড়িয়া", "চাঁদপুর", 
            "চাঁপাইনবাবগঞ্জ", "চট্টগ্রাম", "চুয়াডাঙ্গা", "কুমিল্লা", "কক্সবাজার", "ঢাকা", "দিনাজপুর", "ফরিদপুর", 
            "ফেনী", "গাইবান্ধা", "গাজীপুর", "গোপালগঞ্জ", "হবিগঞ্জ", "জামালপুর", "যশোর", "ঝালকাঠি", 
            "ঝিনাইদহ", "জয়পুরহাট", "খাগড়াছড়ি", "খুলনা", "কুষ্টিয়া", "কুড়িগ্রাম", "লক্ষ্মীপুর", "লালমনিরহাট", 
            "মাদারীপুর", "মাগুরা", "মানিকগঞ্জ", "মেহেরপুর", "মৌলভীবাজার", "মুন্সীগঞ্জ", "ময়মনসিংহ", "নওগাঁ", 
            "নড়াইল", "নাটোর", "নেত্রকোণা", "নীলফামারী", "নোয়াখালী", "পাবনা", "পঞ্চগড়", "পটুয়াখালী", 
            "পিরোজপুর", "রাজবাড়ী", "রাজশাহী", "রাঙ্গামাটি", "রংপুর", "সাতক্ষীরা", "শরীয়তপুর", "শেরপুর", 
            "সিরাজগঞ্জ", "সুনামগঞ্জ", "সিলেট", "টাঙ্গাইল", "ঠাকুরগাঁও", "গোপালগঞ্জ", "নারায়ণগঞ্জ", "নরসিংদী"
        ];

        const locationDatabase = {
            "কুমিল্লা": {
                "মেঘনা": ["বড়কান্দা", "মানিকারচর", "ভাওরখোলা", "গোবিন্দপুর", "লুটেরচর", "রাধানগর", "চালিবাঙ্গা", "সোনারচর"],
                "দাউদকান্দি": ["দাউদকান্দি বাজার", "গৌরীপুর", "ইলিয়টগঞ্জ", "পেন্নাই", "সুন্দলপুর", "বিটেশ্বর", "মারুকা", "বারপাড়া"],
                "চান্দিনা": ["চান্দিনা বাজার", "কেরণখালী", "মাধাইয়া", "বড়করই", "মহিচাইল", "মাইজখার"],
                "কোতোয়ালী/সদর": ["কান্দিরপাড়", "টমসমব্রীজ", "ঝাউতলা", "শাসনগাছা", "চকবাজার", "রেসকোর্স", "বাদশামিয়া বাজার"],
                "লাকসাম": ["লাকসাম শহর", "মুদাফফরগঞ্জ", "কান্দিরপাড়", "গোবিন্দপুর", "উত্তরদা"],
                "মুরাদনগর": ["কোম্পানীগঞ্জ", "মুরাদনগর সদর", "বাংগরা", "রামচন্দ্রপুর", "ধামঘর"],
                "দেবিদ্বার": ["দেবিদ্বার শহর", "গুনাইঘর", "রেভল্যুশন", "ভল্লবপুর", "ফাাতেহাবাদ"],
                "বুড়িচং": ["বুড়িচং সদর", "ভারেল্লা", "ময়নামতি", "ষোলহল্লা"],
                "ব্রাহ্মণপাড়া": ["ব্রাহ্মণপাড়া সদর", "মাধবপুর", "শাঁখাই"],
                "চৌদ্দগ্রাম": ["চৌদ্দগ্রাম বাজার", "মিয়াবাজার", "গুণবতী", "চিওড়া"],
                "হোমনা": ["হোমনা বাজার", "ঘাগুটিয়া", "আছাদপুর", "ভাষানচর"],
                "তিথাস": ["কড়িকান্দি", "জিয়ারকান্দি", "মজিদপুর"],
                "মনোহরগঞ্জ": ["মনোহরগঞ্জ শহর", "হাসনাবাদ", "লক্ষণপুর"],
                "নাঙ্গলকোট": ["নাঙ্গলকোট বাজার", "জোড্ডা", "বক্সগঞ্জ"],
                "লালমাই": ["বাঘমারা", "পেরুল"]
            },
            "ঢাকা": {
                "ধানমন্ডি": ["ধানমন্ডি ১৫", "ধানমন্ডি ২৭", "সোবহানবাগ", "রাসেল স্কয়ার", "সায়েন্সল্যাব", "জিগাতলা"],
                "গুলশান": ["গুলশান ১", "গুলশান ২", "নিকুঞ্জ", "কড়াইল", "কলাবাগান"],
                "মিরপুর": ["মিরপুর ১০", "মিরপুর ১১", "মিরপুর ১২", "মিরপুর ১", "পল্লবী", "কাজীপাড়া", "শেওড়াপাড়া"],
                "সাভার": ["সাভার বাসস্ট্যান্ড", "নবীনগর", "আশুলিয়া", "ধামরাই", "আমিনবাজার"],
                "উত্তরা": ["উত্তরা সেক্টর ১-১৪", "আজমপুর", "জসীমউদ্দীন", "আব্দুল্লাহপুর"],
                "মোহাম্মদপুর": ["টাউনহল", "জাপান গার্ডেন সিটি", "শেখরটেক", "বসিলা"]
            },
            "চট্টগ্রাম": {
                "পাঁচলাইশ": ["প্রবর্তক", "জিইসি", "২ নম্বর গেট", "ষোলশহর"],
                "কোতোয়ালী": ["আন্দরকিল্লা", "নিউ মার্কেট", "সিআরবি", "লালখান বাজার"],
                "পতেঙ্গা": ["পতেঙ্গা বিচ", "ইপিজেড", "কাঠগড়"],
                "হালিশহর": ["বড়পোল", "নয়াবাজার", "আবাসিক এলাকা"]
            }
        };

        const districtSelect = document.getElementById("district");
        const uniqueDistricts = [...new Set(districtsList)].sort();
        
        uniqueDistricts.forEach(d => {
            let opt = document.createElement("option");
            opt.value = d;
            opt.textContent = d;
            districtSelect.appendChild(opt);
        });

        function updateThanas() {
            const thanaSelect = document.getElementById("thana");
            const villageSelect = document.getElementById("village");
            const selectedDistrict = districtSelect.value;

            thanaSelect.innerHTML = '<option value="">থানা নির্বাচন করুন</option>';
            villageSelect.innerHTML = '<option value="">প্রথমে থানা নির্বাচন করুন</option>';
            villageSelect.disabled = true;

            if (selectedDistrict && locationDatabase[selectedDistrict]) {
                thanaSelect.disabled = false;
                const thanas = Object.keys(locationDatabase[selectedDistrict]);
                thanas.forEach(t => {
                    let opt = document.createElement("option");
                    opt.value = t;
                    opt.textContent = t;
                    thanaSelect.appendChild(opt);
                });
            } else if (selectedDistrict) {
                thanaSelect.disabled = false;
                ["সদর থানা", "উপজেলা ১ / মডেল থানা", "উপজেলা ২", "উপজেলা ৩", "অন্যান্য থানা"].forEach(t => {
                    let opt = document.createElement("option");
                    opt.value = t;
                    opt.textContent = t;
                    thanaSelect.appendChild(opt);
                });
            } else {
                thanaSelect.disabled = true;
            }
        }

        function updateVillages() {
            const thanaSelect = document.getElementById("thana");
            const villageSelect = document.getElementById("village");
            const selectedDistrict = districtSelect.value;
            const selectedThana = thanaSelect.value;

            villageSelect.innerHTML = '<option value="">এলাকা / গ্রাম নির্বাচন করুন</option>';

            if (selectedDistrict && selectedThana && locationDatabase[selectedDistrict] && locationDatabase[selectedDistrict][selectedThana]) {
                villageSelect.disabled = false;
                const villages = locationDatabase[selectedDistrict][selectedThana];
                villages.forEach(v => {
                    let opt = document.createElement("option");
                    opt.value = v;
                    opt.textContent = v;
                    villageSelect.appendChild(opt);
                });
            } else if (selectedThana) {
                villageSelect.disabled = false;
                ["পৌরসভা / প্রধান বাজার", "গ্রাম ১ / ওয়ার্ড ১", "গ্রাম ২ / ওয়ার্ড ২", "গ্রাম ৩ / ওয়ার্ড ৩", "অন্যান্য এলাকা"].forEach(v => {
                    let opt = document.createElement("option");
                    opt.value = v;
                    opt.textContent = v;
                    villageSelect.appendChild(opt);
                });
            } else {
                villageSelect.disabled = true;
            }
        }

        function handleFormSubmit(event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            let phone = document.getElementById("phone").value;
            const district = document.getElementById("district").value;
            const thana = document.getElementById("thana").value;
            const village = document.getElementById("village").value;
            const address = document.getElementById("address").value;

            if (phone.startsWith("0")) {
                phone = "88" + phone;
            }

            // Green API তথ্য (আপডেট করা হলো)
            const idInstance = "710722741031"; 
            const apiTokenInstance = "32558964f5ac463184cf7fed6816e833253d75182aed4cae87"; 

            const messageText = `প্রিয় ${name},\nNF WORLD-এ আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে!\n\nঅর্ডারের বিবরণ:\nজেলা: ${district}\nথানা: ${thana}\nগ্রাম: ${village}\nঠিকানা: ${address}\n\nধন্যবাদ! আমাদের প্রতিনিধি শীঘ্রই আপনার সাথে যোগাযোগ করবেন।`;

            // WhatsApp ব্যাকগ্রাউন্ড মেসেজ
            fetch(`https://api.green-api.com/waInstance${idInstance}/sendMessage/${apiTokenInstance}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chatId: `${phone}@c.us`,
                    message: messageText
                })
            })
            .then(response => response.json())
            .then(data => console.log("WhatsApp Message Sent:", data))
            .catch(error => console.error("Error sending WhatsApp message:", error));

            document.getElementById("formContainer").style.display = "none";
            document.getElementById("successBox").style.display = "block";
        }
    </script>
</body>
</html>
